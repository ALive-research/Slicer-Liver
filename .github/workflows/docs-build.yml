# Sphinx documentation build check.
#
# Per ADR-0017: every PR + push runs `sphinx-build -W` against
# `Docs/conf.py` to catch MyST syntax errors, broken cross-document
# references, and dead links before merge.  Publishing to
# ReadTheDocs is handled by RTD's own GitHub-webhook integration
# (not this workflow); this workflow is the merge-gate.

name: docs-build

on:
  pull_request:
    paths:
      - "Docs/**"
      - "requirements-docs.txt"
      - ".readthedocs.yaml"
      - ".github/workflows/docs-build.yml"
  push:
    branches:
      - preview
      - main

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: sphinx-build (HTML)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build HTML (warnings as errors)
        run: |
          set -euo pipefail
          # `-W` promotes warnings to errors so link rot, MyST syntax
          # errors, and missing toctree entries fail the job rather
          # than slipping through.  `--keep-going` reports every
          # warning in a run instead of bailing on the first.
          sphinx-build -b html -W --keep-going Docs Docs/_build/html

      - name: Upload HTML artefact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: Docs/_build/html
          retention-days: 14
