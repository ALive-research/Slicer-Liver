# CI for Slicer-Liver — see Docs/adr/0005-github-actions-ci.md
#
# Two jobs run in parallel on every PR and on every push to `develop`:
#   - docs-lint    : fast (~30 s); validates Mermaid fences and internal
#                    Markdown links across Docs/.  No Slicer dependency.
#   - build-test   : slow (~10–30 min); builds the extension against a
#                    pinned slicer-master container and runs CTest.
#                    The container reference is TBD-verified-on-first-run;
#                    once confirmed, ADR-0005 is amended to record it.

name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — documentation lint (Mermaid fences + internal links).
  # No Slicer dependency; runs in ~30 s.  Catches broken diagrams and
  # dead inter-ADR links before they reach human review.
  # ---------------------------------------------------------------------------
  docs-lint:
    name: docs-lint (Mermaid + Markdown links)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for mermaid-cli)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@10

      - name: Validate Mermaid fences in Docs/architecture/
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/mermaid-extracts
          fail=0
          for f in Docs/architecture/*.md; do
            echo "::group::Validating Mermaid fences in $f"
            # Extract each ```mermaid ... ``` fence to a separate .mmd file
            # and run mmdc on it to a /dev/null-equivalent output.
            awk '
              /^```mermaid$/ { inblock=1; n++; out="/tmp/mermaid-extracts/'$( basename "$f" .md )'-"n".mmd"; next }
              /^```$/ && inblock { inblock=0; next }
              inblock { print > out }
            ' "$f"
            for mmd in /tmp/mermaid-extracts/"$(basename "$f" .md)"-*.mmd; do
              [ -e "$mmd" ] || continue
              if ! mmdc -i "$mmd" -o "${mmd%.mmd}.svg" --quiet; then
                echo "::error file=$f::Mermaid syntax error in fence (extracted to $mmd)"
                fail=1
              fi
            done
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Check Markdown links via lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --exclude-loopback
            'Docs/**/*.md'
            'README.md'
            'CONTRIBUTING.md'
          fail: true

  # ---------------------------------------------------------------------------
  # Job 2 — build + test against slicer-master in a pre-built container.
  # Container reference is TBD on first run.  Adjust both `image:` here
  # and ADR-0005 if the first run resolves it differently.
  # ---------------------------------------------------------------------------
  build-test:
    name: build-test (slicer-master, Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    # Use `slicer/slicer-base` — the same image 3D Slicer's own PR CI
    # uses to build Slicer (see Slicer/SlicerDocker README + Slicer's
    # `.github/actions/slicer-build/Dockerfile`).  It ships Slicer
    # pre-built at /usr/src/Slicer-build/, which lets us build a
    # downstream extension directly against it.
    #
    # The previous `slicer/slicer-build:latest` image was retired in
    # 2018 and its ancient glibc broke `actions/checkout@v4`'s Node 20
    # binary; slicer-base is actively maintained (rebuilt with each
    # Slicer release).  Pin to `:latest` while iterating; switch to a
    # digest pin once the workflow is stable.
    container:
      image: slicer/slicer-base:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Slicer in container
        id: slicer
        run: |
          set -euo pipefail
          # slicer/slicer-base places the Slicer build tree at a known
          # path (the inner `Slicer-build` is where SlicerConfig.cmake
          # lives — that's what `Slicer_DIR` must point at).
          candidates=(
            /usr/src/Slicer-build/Slicer-build
            /usr/src/Slicer-build
            "${Slicer_DIR:-}"
          )
          for cand in "${candidates[@]}"; do
            [ -n "$cand" ] || continue
            if [ -f "$cand/SlicerConfig.cmake" ]; then
              echo "Found SlicerConfig.cmake under $cand"
              echo "slicer_dir=$cand" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          if [ -z "$(grep '^slicer_dir=' "$GITHUB_OUTPUT" 2>/dev/null || true)" ]; then
            echo "::error::Could not locate SlicerConfig.cmake in slicer-base."
            echo "::error::Probed: ${candidates[*]}"
            echo "::error::Inspect image with: docker run --rm slicer/slicer-base:latest find / -name SlicerConfig.cmake"
            exit 1
          fi

      - name: Configure
        run: |
          set -euo pipefail
          mkdir -p build
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING:BOOL=ON \
            -DSlicer_DIR="${{ steps.slicer.outputs.slicer_dir }}"

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Test (CTest)
        run: |
          set -euo pipefail
          cd build
          ctest --output-on-failure --no-tests=error
