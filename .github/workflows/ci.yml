# CI for Slicer-Liver — see Docs/adr/0005-github-actions-ci.md
#
# Three jobs run in parallel on every PR and on every push to `preview`:
#   - docs-lint   : fast (~30 s); validates Mermaid fences and internal
#                   Markdown links across Docs/.  No Slicer dependency.
#   - build-test  : slow (~10–30 min); builds the extension against the
#                   project-maintained ghcr.io/alive-research/
#                   slicer-build-ubuntu2404 image (Slicer main pre-built)
#                   and runs CTest.  Image recipe and auto-build live in
#                   the ALive-Docker repository.
#   - coverage    : slow (~10–30 min); same image as build-test but
#                   instruments the C++ build with GCC --coverage, runs
#                   CTest + pytest under coverage.py, and uploads the
#                   resulting Cobertura XML files to Codecov.  Per
#                   Docs/adr/0021-coverage-measurement.md the job is
#                   intentionally NON-BLOCKING in its first cut — not on
#                   branch protection's required list; the PR-comment
#                   diff coverage is the signal.

name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [preview]
  workflow_dispatch: {}

permissions:
  contents: read
  # `packages: read` is required even though
  # ghcr.io/alive-research/slicer-build-ubuntu2404 is public.  The
  # GitHub Actions runner auto-logs in to ghcr.io as `${{ github.actor }}`
  # with `GITHUB_TOKEN`; the subsequent docker pull uses those
  # credentials, and a logged-in pull with a token lacking
  # `read:packages` scope is denied — even when anonymous pull of the
  # same image would succeed.  Granting the scope makes the
  # auto-injected login authoritative.
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — documentation lint (Mermaid fences + internal links).
  # No Slicer dependency; runs in ~30 s.  Catches broken diagrams and
  # dead inter-ADR links before they reach human review.
  # ---------------------------------------------------------------------------
  docs-lint:
    name: docs-lint (Mermaid + Markdown links)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for mermaid-cli)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@10

      - name: Validate Mermaid fences in Docs/architecture/
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p /tmp/mermaid-extracts
          fail=0
          for f in Docs/architecture/*.md; do
            echo "::group::Validating Mermaid fences in $f"
            # Extract each ```mermaid ... ``` fence to a separate .mmd file
            # and run mmdc on it to a /dev/null-equivalent output.
            awk '
              /^```mermaid$/ { inblock=1; n++; out="/tmp/mermaid-extracts/'$( basename "$f" .md )'-"n".mmd"; next }
              /^```$/ && inblock { inblock=0; next }
              inblock { print > out }
            ' "$f"
            for mmd in /tmp/mermaid-extracts/"$(basename "$f" .md)"-*.mmd; do
              [ -e "$mmd" ] || continue
              if ! mmdc -i "$mmd" -o "${mmd%.mmd}.svg" --quiet; then
                echo "::error file=$f::Mermaid syntax error in fence (extracted to $mmd)"
                fail=1
              fi
            done
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Check Markdown links via lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --exclude-loopback
            'Docs/**/*.md'
            'README.md'
            'CONTRIBUTING.md'
          fail: true

  # ---------------------------------------------------------------------------
  # Job 2 — build + test against pre-built Slicer in a project-managed
  # container image.
  # ---------------------------------------------------------------------------
  build-test:
    name: build-test (slicer-main, Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    # The container image's default shell is /bin/sh (dash), which
    # doesn't understand `set -o pipefail`.  Several steps below rely
    # on it; force bash at the job level.
    defaults:
      run:
        shell: bash

    # `ghcr.io/alive-research/slicer-build-ubuntu2404` is the
    # project-maintained image (Ubuntu 24.04 + Qt 6.9 + Slicer main
    # pre-built); recipe and auto-build workflow live in the
    # `ALive-Docker` repository (slicer-build-ubuntu2404/Dockerfile +
    # .github/workflows/build-image.yml).
    #
    # PINNED to a specific Slicer-main build, NOT `:latest` — see
    # Docs/adr/0030-ci-slicer-image-pinning.md.  `:latest` is a rolling
    # tag rebuilt from Slicer main; a moving base means every PR builds
    # against a different, non-reproducible Slicer and a bad upstream
    # push lands on whichever PR happens to run during the window.  The
    # `:main-<sha>` tag below names the exact Slicer commit; bump it
    # deliberately via a dedicated image-bump PR (which absorbs any
    # upstream breakage in isolation), never implicitly.  Keep the two
    # jobs (build-test + coverage) on the SAME pin.
    #   main-4fb4ac4 = Slicer main @ 4fb4ac4
    #   digest sha256:549a820f32d78dfb723c50cfed34519ba362ccfbae1791a6487a76cae588f756
    #
    # SlicerConfig.cmake is at /usr/src/Slicer-build/Slicer-build/
    # (the doubled `Slicer-build` is Slicer's superbuild convention).
    container:
      image: ghcr.io/alive-research/slicer-build-ubuntu2404:main-4fb4ac4
      options: --user root

    env:
      Slicer_DIR: /usr/src/Slicer-build/Slicer-build
      # Force Qt's offscreen platform plugin.  The image sets
      # ENV DISPLAY=:99 but does not actually run Xvfb, so any Qt
      # test that tries to bring up a real X connection (xcb plugin)
      # crashes with "could not connect to display :99".
      # `QT_QPA_PLATFORM=offscreen` is Qt's official headless mode —
      # it renders to an in-memory surface, suitable for CTest.
      QT_QPA_PLATFORM: offscreen
      # SlicerLayerDM is pre-built into the slicer-build-ubuntu2404
      # image as an EXTENSION_DEPENDS provider for Slicer-Liver
      # (per ADR-0002 / ADR-0013 §5).  The image's Dockerfile pins
      # LAYERDM_REVISION and exports SlicerLayerDisplayableManager_DIR
      # pointing at /usr/src/SlicerLayerDM-build.  Slicer-Liver's
      # find_package call uses the upstream extension's project() name
      # (LayerDisplayableManager, NOT SlicerLayerDisplayableManager —
      # see CMakeLists.txt comment on the EXTENSION_DEPENDS entry), so
      # we re-bind the same build tree to that variable here.  Bumping
      # the pin happens in the ALive-Docker repo + image rebuild.
      LayerDisplayableManager_DIR: /usr/src/SlicerLayerDM-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Skip the ~6 min Slicer build + CTest run when a PR touches only
      # documentation / ADRs / architecture diagrams / repo-level meta files.
      #
      # The job itself still spawns and reports success on docs-only PRs —
      # this preserves the "build-test (slicer-main, Linux)" check name so
      # future branch-protection rules requiring it continue to pass without
      # needing to be reconfigured (a skipped *job* would block merges; a
      # job whose steps no-op does not).
      #
      # Filter scope:
      #   - Docs/**                       (ADRs, architecture diagrams, surveys)
      #   - root-level *.md               (README, CONTRIBUTING, SECURITY, …)
      #   - .github/pull_request_template.md and CODEOWNERS
      #   - CITATION.cff / License.txt / COPYRIGHT.txt
      #
      # Filter is PR-scoped — push events (merge to preview, direct push,
      # workflow_dispatch) always run the full build to catch any drift.
      # ---------------------------------------------------------------------
      # We want: "every changed file is a doc-shaped file → skip build".
      # dorny/paths-filter@v3 cannot express that natively: its
      # ``predicate-quantifier`` supports only ``some`` (≥ 1 file matches
      # any pattern) and ``every`` (≥ 1 file matches every pattern);
      # neither is "every file matches some pattern".  Prior attempts
      # using ``predicate-quantifier: every`` with positive patterns
      # (PR #368, PR #371) and the negation-plus-``**`` inversion
      # (PR #375) both failed for that reason.  PR #375's smoke test
      # against a single-file pure-docs diff explicitly confirmed
      # ``non-docs = true`` instead of false.
      #
      # tj-actions/changed-files DOES express it natively via
      # ``files_ignore``: ``any_changed`` is true iff at least one
      # changed file is outside the ignored set.  Pure-docs PRs (every
      # changed file matches the ignore list) yield ``any_changed=false``
      # → skip the heavy build steps.
      - name: Detect non-docs change
        id: changes
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v45
        with:
          files_ignore: |
            Docs/**
            *.md
            .github/pull_request_template.md
            .github/CODEOWNERS
            CITATION.cff
            License.txt
            COPYRIGHT.txt
            requirements-docs.txt
            .readthedocs.yaml
            .codecov.yml

      - name: Report skip (docs-only PR)
        if: github.event_name == 'pull_request' && steps.changes.outputs.any_changed == 'false'
        run: |
          echo "::notice::Skipping Slicer build/test — every changed file is in the docs-ignore set."
          echo "any_changed is false; build-test job reports success without running heavy steps."

      - name: Verify Slicer build tree
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          test -f "${Slicer_DIR}/SlicerConfig.cmake" \
            || { echo "::error::SlicerConfig.cmake missing at ${Slicer_DIR} — image layout has drifted"; exit 1; }
          test -f "${LayerDisplayableManager_DIR}/LayerDisplayableManagerConfig.cmake" \
            || { echo "::error::LayerDisplayableManagerConfig.cmake missing at ${LayerDisplayableManager_DIR} — image layout has drifted"; exit 1; }
          echo "Slicer_DIR=${Slicer_DIR}"
          echo "LayerDisplayableManager_DIR=${LayerDisplayableManager_DIR}"

      # Runtime-sanity smoke for the pinned image (ADR-0030).  The layout
      # checks above catch a *build-tree* drift; this catches a *runtime*
      # drift — a pinned image whose Slicer Python is broken/partial.
      # That exact failure (a `slicer.util` with no `exit`) once turned the
      # launched test harness into a 1500 s hang; fail fast here with a
      # clear message at bump time instead.  PythonSlicer imports `slicer`
      # as a library (no event loop, no hang risk), so this is cheap.
      - name: Smoke-check pinned Slicer runtime
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          PYTHONSLICER="${Slicer_DIR}/../python-install/bin/PythonSlicer"
          test -x "${PYTHONSLICER}" \
            || { echo "::error::PythonSlicer not found at ${PYTHONSLICER} — pinned image layout has drifted (ADR-0030)"; exit 1; }
          "${PYTHONSLICER}" -c "import sys, slicer.util as u; m=[a for a in ('exit','VTKObservationMixin') if not hasattr(u,a)]; sys.exit('slicer.util is missing '+', '.join(m)+' -- pinned image runtime has drifted') if m else print('slicer.util runtime smoke OK')" \
            || { echo "::error::Pinned Slicer image is runtime-broken (slicer.util incomplete) — bump/repin per ADR-0030 rather than debugging a downstream hang"; exit 1; }

      - name: Configure
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build
          # LayerDisplayableManager_DIR is set in the job-level env: block
          # and points at the pre-built tree baked into the
          # slicer-build-ubuntu2404 image.  find_package(LayerDisplayableManager)
          # in CMakeLists.txt picks it up automatically; we still pass it
          # explicitly here for trace clarity in the CI log.
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING:BOOL=ON \
            -DSlicerLiver_ENABLE_VISUAL_TESTS:BOOL=ON \
            -DSlicer_DIR="${Slicer_DIR}" \
            -DLayerDisplayableManager_DIR="${LayerDisplayableManager_DIR}"

      - name: Build
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Test (CTest)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          cd build
          # `LiverBezierVisualTest_*` entries are excluded here and run
          # in their own soft-gated step below (under xvfb + Mesa software
          # GL), so this step stays focused on the non-visual suite.  See
          # LiverResections/Testing/README.md.
          # `pytest_launched` is ALSO excluded here and run in its own
          # soft-gated step below: the launched-Slicer harness flakily fails
          # to register scripted modules in this CI environment (issue #460 —
          # e.g. `liversegmentation` intermittently absent from
          # slicer.modules, hard-failing its registration RED-pin), although
          # the modules build cleanly and register reliably locally.  Until
          # the #460 launched-harness registration race is fixed, the row runs
          # and reports but does not block; promote it back to a hard gate
          # once registration is deterministic.
          # `-V` (verbose) dumps each test's stdout/stderr in the CI log
          # regardless of pass/fail.  Replaces the prior `--output-on-failure`
          # so that aggregated pytest entries (e.g. `pytest_scaffold` from
          # ADR-0008's scaffold) reveal the per-pytest-test breakdown instead
          # of just the CTest pass/fail line.  Trade-off: more noisy log
          # (the native C++ tests also dump on success), accepted because
          # CI logs are append-mostly archives and one-glance pytest
          # visibility outweighs the line count.
          ctest -V --no-tests=error \
                --exclude-regex '^(LiverBezierVisualTest_.*|pytest_launched)$'

      # ---------------------------------------------------------------------
      # Visual-regression tests (per ADR-0020 §"Rollout plan" §7).
      # SOFT-GATED (continue-on-error): the capture -> upload -> mirror
      # replay loop runs here and reports, but does NOT block.  Rationale:
      # the runner has no GPU and offscreen rendering through the GLX +
      # llvmpipe software path HANGS (reproduced); true headless offscreen
      # needs the EGL path (VTK_OPENGL_HAS_EGL=ON in the build) wired
      # through, which is not done yet.  Neither upstream Slicer nor
      # SlicerLayerDM hard-gates headless GL rendering in public CI for the
      # same reason.  Until the EGL render path lands, the local interactive
      # arena + the uploaded baseline are the verification of record, and a
      # render hiccup surfaces as a notice (exactly what ADR-0020 §7
      # anticipated).  Promote to a hard-required step once EGL offscreen
      # works -- tracked as a follow-up issue.
      #
      # The per-test TIMEOUT (set in LiverResections/Testing/Python/
      # CMakeLists.txt) caps a stuck render so a hang fails fast as a
      # notice instead of holding the job open to its global limit.
      #
      # Offscreen GL knobs (best-effort for the day EGL lands): xvfb-run
      # provides a virtual display, and the env forces Mesa's software
      # rasteriser.  These apply only to this step.
      # ---------------------------------------------------------------------
      - name: Test (CTest — visual regression)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        continue-on-error: true
        env:
          LIVER_RUN_VISUAL_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          cd build
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ctest -V --no-tests=error \
                  --tests-regex '^LiverBezierVisualTest_.*$'

      # ---------------------------------------------------------------------
      # Launched-Slicer pytest harness (pytest_launched).
      # HARD GATE: the registration flake that soft-gated this row was
      # root-caused and fixed (quitOnLastWindowClosed under
      # --no-main-window queued an app quit that mass-unloaded modules
      # mid-suite; the driver now disables the flag), and the row has
      # since caught real drift (the Liver shell suites).  A launched
      # failure blocks the merge like every other test row.
      # ---------------------------------------------------------------------
      - name: Test (CTest — launched pytest)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          cd build
          ctest -V --no-tests=error \
                --tests-regex '^pytest_launched$'

  # ---------------------------------------------------------------------------
  # Job 3 — coverage instrumentation.
  #
  # Per Docs/adr/0021-coverage-measurement.md, builds the extension with
  # GCC's --coverage flags (a Debug rebuild — separate from build-test's
  # Release build, so the two jobs run in parallel without artefact
  # collisions), runs CTest, generates a Cobertura coverage-cxx.xml
  # via `gcovr`, generates a Cobertura coverage-py.xml from pytest's
  # --cov plugin, and uploads both to Codecov via
  # codecov/codecov-action@v5.
  #
  # The job is intentionally NON-BLOCKING in its first cut: do NOT add
  # `coverage (slicer-main, Linux)` to branch-protection's required
  # checks.  The signal is the PR comment (line-by-line diff coverage),
  # not the job's pass/fail status.  ADR-0021 §"Why no absolute
  # threshold" — informational only.
  #
  # The first run after this PR merges will likely fail or report
  # partial data until the maintainer authorises the Codecov GitHub
  # app on ALive-research/Slicer-Liver (one-time admin step, ~2 min,
  # OAuth via codecov.io).  That's expected; the workflow itself is
  # otherwise complete.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage (slicer-main, Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    # Pinned to the SAME Slicer-main build as build-test — see
    # Docs/adr/0030-ci-slicer-image-pinning.md.  Bump both jobs together
    # in the image-bump PR; never let the two drift onto different Slicer
    # commits.  main-4fb4ac4 = Slicer main @ 4fb4ac4
    # (digest sha256:549a820f32d78dfb723c50cfed34519ba362ccfbae1791a6487a76cae588f756).
    container:
      image: ghcr.io/alive-research/slicer-build-ubuntu2404:main-4fb4ac4
      options: --user root

    env:
      Slicer_DIR: /usr/src/Slicer-build/Slicer-build
      QT_QPA_PLATFORM: offscreen
      LayerDisplayableManager_DIR: /usr/src/SlicerLayerDM-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mirror build-test's docs-only skip: pure-docs PRs do not need
      # the coverage job either.  Identical ignore list with the
      # exception that .codecov.yml is NOT ignored here — changing the
      # Codecov config should re-run the coverage job to verify the
      # config still produces a valid upload.
      - name: Detect non-docs change
        id: changes
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v45
        with:
          files_ignore: |
            Docs/**
            *.md
            .github/pull_request_template.md
            .github/CODEOWNERS
            CITATION.cff
            License.txt
            COPYRIGHT.txt
            requirements-docs.txt
            .readthedocs.yaml

      - name: Report skip (docs-only PR)
        if: github.event_name == 'pull_request' && steps.changes.outputs.any_changed == 'false'
        run: |
          echo "::notice::Skipping coverage build — every changed file is in the docs-ignore set."

      # gcovr + pytest-cov are not yet baked into the
      # slicer-build-ubuntu2404 image.  Bootstrap via pip --user; an
      # ALive-Docker follow-up issue tracks adding them to the base
      # image so the bootstrap step disappears.
      - name: Install coverage tools
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          # Ubuntu 24.04's system Python is PEP 668 "externally managed",
          # so ``pip install --user`` refuses without an explicit override.
          # Use a dedicated venv inside the job — isolates from the image's
          # Python without needing ``--break-system-packages`` (which the
          # ALive-Docker follow-up could replace with apt-packaged gcovr +
          # python3-pytest-cov in the base image).
          python3 -m venv /tmp/coverage-venv
          /tmp/coverage-venv/bin/pip install --upgrade pip
          # ``numpy`` is required by ``Testing/Python/unit/test_bezier_characterization.py``
          # (it imports ``numpy as np`` at module load).  Without it
          # pytest's collection phase errors with
          # ``ModuleNotFoundError: No module named 'numpy'`` and the
          # full session is interrupted before pytest-cov can emit the
          # Cobertura XML — symptom: ``coverage-py.xml`` never appears
          # at the workspace root and Codecov's upload arrives without
          # any Python coverage data.
          /tmp/coverage-venv/bin/pip install 'gcovr>=7' 'pytest-cov>=5' 'pytest>=8' 'numpy>=1.24'
          echo "/tmp/coverage-venv/bin" >> "$GITHUB_PATH"
          # Python coverage must run under SLICER's Python (PythonSlicer):
          # the venv's plain python3 cannot import vtk / slicer / SimpleITK,
          # so the unit layer collection-errors and ~nothing executes --
          # which is why the ``py`` flag reported 0.2% while the SAME tests
          # pass in build-test (whose CTest rows use Slicer's Python).
          # pytest is already importable from Slicer's Python; add
          # pytest-cov (and its ``coverage`` dependency) beside it.
          PYTHONSLICER="${Slicer_DIR}/../python-install/bin/PythonSlicer"
          "${PYTHONSLICER}" -m pip install 'pytest-cov>=5'

      - name: Verify Slicer build tree
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          test -f "${Slicer_DIR}/SlicerConfig.cmake" \
            || { echo "::error::SlicerConfig.cmake missing at ${Slicer_DIR} — image layout has drifted"; exit 1; }
          test -f "${LayerDisplayableManager_DIR}/LayerDisplayableManagerConfig.cmake" \
            || { echo "::error::LayerDisplayableManagerConfig.cmake missing at ${LayerDisplayableManager_DIR} — image layout has drifted"; exit 1; }

      # Runtime-sanity smoke for the pinned image (ADR-0030) — same guard
      # as build-test; catches a runtime-broken pinned Slicer at bump time.
      - name: Smoke-check pinned Slicer runtime
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          PYTHONSLICER="${Slicer_DIR}/../python-install/bin/PythonSlicer"
          test -x "${PYTHONSLICER}" \
            || { echo "::error::PythonSlicer not found at ${PYTHONSLICER} — pinned image layout has drifted (ADR-0030)"; exit 1; }
          "${PYTHONSLICER}" -c "import sys, slicer.util as u; m=[a for a in ('exit','VTKObservationMixin') if not hasattr(u,a)]; sys.exit('slicer.util is missing '+', '.join(m)+' -- pinned image runtime has drifted') if m else print('slicer.util runtime smoke OK')" \
            || { echo "::error::Pinned Slicer image is runtime-broken (slicer.util incomplete) — bump/repin per ADR-0030 rather than debugging a downstream hang"; exit 1; }

      - name: Configure (Debug + --coverage)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p build-coverage
          # -O0 prevents inlining that would confuse gcov line attribution.
          # --coverage is short for -fprofile-arcs -ftest-coverage and
          # implies -lgcov at link time.
          #
          # Slicer's CMake macros (``slicerMacroBuildLoadableModule``,
          # ``slicerMacroBuildScriptedModule``, etc.) reset
          # ``CMAKE_CXX_FLAGS`` per-target with their own preset, which
          # silently drops the ``-DCMAKE_CXX_FLAGS="--coverage"`` we
          # tried to pass through.  Diagnostic evidence from PR #427
          # (run 26286677329): across an 89-target instrumented build
          # only **2 .gcno files** landed in ``build-coverage`` and
          # **0 .gcda** were written by the 30 passing tests -- the
          # Slicer-Liver loadable modules were never instrumented.
          #
          # The fix uses CMake's COMPILER_LAUNCHER mechanism: a single
          # launcher script ``/tmp/cov-launcher`` is invoked as a
          # prefix to every compile call, taking the compiler path as
          # ``$1`` and the rest of the args as ``$@``.  The launcher
          # injects ``--coverage`` between them.  The actual
          # ``CMAKE_C_COMPILER`` / ``CMAKE_CXX_COMPILER`` stays as the
          # toolchain's ``/usr/bin/cc`` and ``/usr/bin/c++``, so
          # SlicerConfig.cmake's strict-compiler-match check at line
          # 967 passes (it would refuse a wrapper compiler since
          # Slicer was pre-built with the toolchain's stock cc/c++).
          # Launcher-based instrumentation survives any Slicer macro
          # that rewrites ``CMAKE_CXX_FLAGS`` because the launcher
          # operates one level below CMake's per-target flag handling.
          mkdir -p /tmp/cov-wrappers
          cat > /tmp/cov-wrappers/launcher <<'WRAP'
          #!/bin/sh
          # CMake compiler launcher.  Argv pattern:
          #   $1     -- compiler executable (cc / c++)
          #   $2..   -- compiler arguments
          # Inject --coverage so every translation unit gets
          # -fprofile-arcs / -ftest-coverage regardless of what
          # CMAKE_CXX_FLAGS the calling project chooses per-target.
          COMPILER=$1
          shift
          exec "$COMPILER" --coverage "$@"
          WRAP
          chmod +x /tmp/cov-wrappers/launcher

          # Both COMPILER_LAUNCHER and LINKER_LAUNCHER point at the
          # same shim.  Without LINKER_LAUNCHER, Slicer macros that
          # rewrite per-target ``LINK_FLAGS`` strip ``--coverage`` from
          # the link command and the resulting .so files fail with
          # ``undefined reference to '__gcov_init'`` because libgcov
          # never gets pulled in (PR #428 first launcher attempt
          # reproduced this exactly).  ``CMAKE_<LANG>_LINKER_LAUNCHER``
          # requires CMake 3.21+; the slicer-build-ubuntu2404 image
          # carries CMake 3.28+.
          cmake -S . -B build-coverage \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING:BOOL=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=/tmp/cov-wrappers/launcher \
            -DCMAKE_CXX_COMPILER_LAUNCHER=/tmp/cov-wrappers/launcher \
            -DCMAKE_C_LINKER_LAUNCHER=/tmp/cov-wrappers/launcher \
            -DCMAKE_CXX_LINKER_LAUNCHER=/tmp/cov-wrappers/launcher \
            -DCMAKE_C_FLAGS="-O0" \
            -DCMAKE_CXX_FLAGS="-O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage" \
            -DSlicer_DIR="${Slicer_DIR}" \
            -DLayerDisplayableManager_DIR="${LayerDisplayableManager_DIR}"

      - name: Build (instrumented)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: cmake --build build-coverage --config Debug -j "$(nproc)"

      - name: Test (CTest, instrumented)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          cd build-coverage
          # Same exclusion set as build-test (LiverBezierVisualTest_* +
          # pytest_launched); the launched row runs SEPARATELY below with
          # Python-coverage env injected, so excluding it here avoids a
          # double run.  Coverage % drift between the two jobs is
          # acceptable as long as the same set of tests actually runs in
          # both.  fail_ci_if_error is false on the upload step so a
          # single failed instrumented test does not block the rest of
          # the PR.
          ctest -V --no-tests=error \
                --exclude-regex '^(LiverBezierVisualTest_.*|pytest_launched)$' || true

      - name: Generate coverage-cxx.xml (gcovr)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          # Cobertura output (Codecov auto-detects).  Excludes Testing
          # subtrees + system headers; the path filter list mirrors
          # `ignore:` in .codecov.yml so the two views agree.
          #
          # `--root` must be the absolute workspace path: gcov records
          # absolute source paths in the .gcno/.gcda metadata
          # (``/__w/Slicer-Liver/Slicer-Liver/...`` inside the GitHub
          # Actions container), and gcovr's source-path filtering
          # only matches when ``--root`` is an absolute prefix of those
          # recorded paths.  Using ``--root .`` left every source file
          # outside the resolved root and gcovr filtered everything out
          # with ``All coverage data is filtered out``, falling through
          # to the empty-skeleton heredoc below.
          # ``--exclude '.*/build-coverage/.*'`` removed: gcovr applies
          # filters to the gcov *data file* paths it discovers, not just
          # source-file paths.  Every .gcda lives under build-coverage/
          # by design; the exclude was matching them all and pruning the
          # real coverage data out before source-path resolution.
          # Symptom: ``(WARNING) All coverage data is filtered out``.
          gcovr \
            --root "$GITHUB_WORKSPACE" \
            --xml --output coverage-cxx.xml \
            --exclude '.*Testing.*' \
            --exclude '.*CMakeFiles.*' \
            --exclude '/usr/.*' \
            --print-summary \
            build-coverage || {
              echo "::warning::gcovr produced no usable data — coverage upload will be partial."
              # Emit an empty Cobertura skeleton so the Codecov upload
              # step still has a file path to attach (it tolerates
              # empty coverage but errors on missing files).
              cat > coverage-cxx.xml <<'XML'
          <?xml version="1.0" ?>
          <coverage version="0"><sources/><packages/></coverage>
          XML
            }

      # Python coverage, leg 1 of 2 — BARE run under Slicer's Python.
      #
      # Runs the same three roots as the launched row.  Must use
      # PythonSlicer, not the venv's plain python3: the unit layer
      # (Testing/Python/unit) imports vtk/numpy and the module suites
      # import SimpleITK — under plain python3 they collection-error /
      # skip and pytest-cov measured ~nothing (the ``py`` flag reported
      # 0.2% with every Representation at 0% while the SAME tests pass
      # in build-test).  ``--cov`` on the SOURCE trees also enumerates
      # never-imported files at 0%, giving the scripted modules honest
      # visibility in the report.  Data-file only (no XML yet): leg 2
      # appends launched-run data and the combine step below emits the
      # final XML.
      - name: Python coverage (bare, Slicer Python)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.bare
        run: |
          set -euo pipefail
          PYTHONSLICER="${Slicer_DIR}/../python-install/bin/PythonSlicer"
          "${PYTHONSLICER}" -m pytest \
              Testing/Python \
              LiverResections/Testing/Python \
              LiverSegmentation/Testing/Python \
            --continue-on-collection-errors \
            --cov=Liver \
            --cov=LiverSegmentation \
            --cov=LiverResections/LiverResectionsLib \
            --cov=LiverVolumetry \
            --cov=VascularTerritories \
            --cov-report= \
            || true

      # Python coverage, leg 2 of 2 — the LAUNCHED row, with coverage
      # injected via PYTEST_ADDOPTS (pytest.main in
      # run_pytest_launched.py honours it).  The launched app imports
      # the STAGED module tree, so --cov targets the build's
      # qt-scripted-modules dir; .coveragerc [paths] + the fix script
      # below fold those records back onto the source files.
      # Non-blocking (|| true): the launched row itself is exercised as
      # a gate in build-test; here it only contributes coverage data.
      - name: Python coverage (launched row)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
          COVERAGE_FILE: ${{ github.workspace }}/.coverage.launched
        run: |
          set -euo pipefail
          staged="$(ls -d "$GITHUB_WORKSPACE"/build-coverage/lib/Slicer-*/qt-scripted-modules 2>/dev/null | head -1 || true)"
          if [ -z "${staged}" ]; then
            echo "::warning::No staged qt-scripted-modules dir found — skipping launched Python coverage."
            exit 0
          fi
          export PYTEST_ADDOPTS="--cov=${staged} --cov-report= -p no:cacheprovider"
          cd build-coverage
          ctest -V --no-tests=error --tests-regex '^pytest_launched$' || true

      # Merge the two legs into coverage-py.xml.  ``coverage combine``
      # applies the .coveragerc [paths] aliases (staged Lib packages ->
      # source); fix_coverage_paths.py then normalizes to repo-relative
      # paths, remaps the flat staged scripted modules
      # (qt-scripted-modules/<Module>.py -> <Module>/<Module>.py), and
      # merges duplicate per-file records.  Any failure falls back to an
      # empty Cobertura skeleton so the Codecov upload step still has a
      # file (it tolerates empty coverage but errors on missing files).
      - name: Generate coverage-py.xml (combine + remap)
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
        run: |
          set -euo pipefail
          PYTHONSLICER="${Slicer_DIR}/../python-install/bin/PythonSlicer"
          {
            data_files=()
            [ -f .coverage.bare ] && data_files+=(.coverage.bare)
            [ -f .coverage.launched ] && data_files+=(.coverage.launched)
            [ ${#data_files[@]} -gt 0 ] \
              && "${PYTHONSLICER}" -m coverage combine "${data_files[@]}" \
              && "${PYTHONSLICER}" -m coverage xml -o coverage-py.xml \
              && python3 .github/scripts/fix_coverage_paths.py coverage-py.xml "$GITHUB_WORKSPACE"
          } || {
            echo "::warning::Python coverage combine/remap produced no usable data — uploading empty coverage-py.xml."
            cat > coverage-py.xml <<'XML'
          <?xml version="1.0" ?>
          <coverage version="0"><sources/><packages/></coverage>
          XML
          }

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || steps.changes.outputs.any_changed == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-cxx.xml,./coverage-py.xml
          flags: cxx,py
          # Non-blocking: per ADR-0021 the job's pass/fail is not a
          # branch-protection signal.  An upload failure (Codecov
          # outage, OAuth not yet configured by the maintainer, etc.)
          # surfaces as a workflow warning but does not fail the PR.
          fail_ci_if_error: false
          # CODECOV_TOKEN is required even for public repos with the
          # Codecov GitHub app installed: as of late 2024 Codecov
          # tightened the upload acceptance rules and tokenless
          # uploads are rejected with the server-side error
          # ``Token required - not valid tokenless upload`` (the
          # initial post-PR-#386 run on preview surfaced this; the
          # workflow itself stayed green because ``fail_ci_if_error:
          # false`` swallows the upload step's exit code).  Wire the
          # repository upload token from app.codecov.io/gh/<org>/
          # <repo>/settings, exported into GitHub Actions as the
          # ``CODECOV_TOKEN`` secret.  Rotating the token is a
          # maintainer-only step on the Codecov side.
          token: ${{ secrets.CODECOV_TOKEN }}
