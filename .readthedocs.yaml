# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# Mirrors the Slicer-core configuration per ADR-0017 — same Python
# minor, same `Docs/conf.py` layout, same epub + pdf outputs.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  builder: html
  configuration: Docs/conf.py
  fail_on_warning: true

formats:
  - epub
  - pdf

python:
  install:
    - requirements: requirements-docs.txt
